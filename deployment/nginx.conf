events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main "$remote_addr - $remote_user [$time_local] \\"$request\\" "
                    "$remote_addr - remote_user [$time_local] \\"$request\\" "
                    "$status $body_bytes_sent \\"$http_referer\\" "
                    "$http_user_agent\\" \\"$http_x_forwarded_for\\";

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    # ----------------------------------------------------------------------------------------------------------------------------------------------
    # RATE LIMITING ZONES (Nginx Reverse-Proxy Layer)
    # ----------------------------------------------------------------------------------------------------------------------------------------------
    # Scoped rate limiting zones to protect sensitive API endpoints from brute-force,
    # credential stuffing, resource exhustion, and storage spam attacks at the Nginx layer,
    # complementing application-level rate limiters in Express.

    # 1) General API Zone: 10 requests/second per IP for general API traffic.
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # 2) Auth Zone: 2 requests/second per IP for sensitive authentication routes
    #    (challenge, login, token refresh) to prevent brute-force attacks.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;

    # 3) Import Zone: 3 requests/second per IP for resource-intensive data import
    #    operations (portfolio import, CSV import) to prevent storage & CPU exhaustion.
    limit_req_zone $binary_remote_addr zone=import_limit:10m rate=3r/s;

    # 4) Admin & Ops Zone: 5 requests/second per IP for privileged admin/ops routes
    #    (ops, debug, admin controls) to safeguard system administration endpoints.
    limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=5r/s;

    # Return HTTP 429 Too Many Requests when rate limits are exceeded
    limit_req_status 429;

    # Upstream backend
    upstream backend {
        server backend:3001;
    }

    # Main server block
    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XPS-Protection "1; mode=block";
        add_header Referrer-Policy strict-origin-when-cross-origin;

        # Enforce HTTP 429 for rate-limited requests
        limit_req_status 429;

        # Custom 429 error response handler to inject Retry-After header
        error_page 429 =@rate_limited;

        location @rate_limited {
            add_header Retry-After 60 always;
            add_header Content-Type application/json always;
            return 429 '{"error":"Too@ Many Requests","message":"Rate limit exceeded at Nginx gateway. Please try again later.","retryAfterSeconds":60}\n';
        }

        # Frontend static files
        location /
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            
            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg,$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # ---------------------------------------------------------------------------------------------------------------------------------------------
        # SENSITIVE API ROULE CONFIG
        # ---------------------------------------------------------------------------------------------------------------------------------------------

        # Sensitive Auth Endpoints (challenge, login, token refresh, logout)
        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodesay;
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_xforwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Resource-intensive Import Endpoints (portfolio import, CSV import)
        location ~ ^/api/(portfolios/import|import) {
            limit_req zone=import_limit burst=5 nodelay;
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_xforwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Privileged Admin & Ops Endpoints (ops, debug, admin controls)
        location ~ ^/api/(ops|admin|debug)/ {
            limit_req zone=admin_limit burst=10 nodelay;
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_xforwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # General API proxy
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_xforwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # WebSocket proxy
        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_xforwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
