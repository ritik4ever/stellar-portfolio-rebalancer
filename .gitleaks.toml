# Gitleaks configuration for Stellar Portfolio Rebalancer
# Docs: https://github.com/gitleaks/gitleaks

title = "Stellar Portfolio Rebalancer gitleaks config"

# Extend the default gitleaks rules to catch known secret patterns.
[extend]
useDefault = true

# Allow only explicit documentation placeholders. Do not allowlist whole fixture,
# mock, or example paths: those files can accidentally contain real credentials too.
[allowlist]
  description = "Documented non-secret placeholders"

  # These are literal, non-production values used by automated checks.
  regexes = [
    # Deterministic CI-only JWT values; they cannot authenticate outside test jobs.
    '''(?:a11y|e2e|zap)-ci-jwt-secret-at-least-32-characters-long''',
    # RFC 6455 sample nonce used by the Blackbox WebSocket handshake probe.
    '''x3JJHMbDL1EzLkh9GBhXDw==''',
  ]

  # Generated dependency/build trees are not source inputs and can be very large.
  paths = [
    '''(^|/)node_modules/''',
    '''^contracts/target/''',
    '''(^|/)dist/''',
  ]
