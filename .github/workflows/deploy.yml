name: Deploy

on:
  push:
    branches: [staging, main]

jobs:
  zap-security-gate:
    name: Security Gate (ZAP)
    uses: ./.github/workflows/zap-scan.yml

  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    needs: zap-security-gate
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.stellar-portfolio.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js for deployment metadata checks
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve Sentry release metadata
        run: node scripts/sentry-metadata.mjs --deployment staging >> "$GITHUB_ENV"

      - name: Validate Sentry release metadata
        run: node scripts/sentry-metadata.mjs --validate

      - name: Build Docker images
        run: docker compose -f deployment/docker-compose.yml build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Terraform init
        run: |
          cd deployment/terraform
          terraform init
          terraform workspace select staging || terraform workspace new staging

      - name: Terraform plan
        run: |
          cd deployment/terraform
          terraform plan -var-file=staging.tfvars -out=tfplan

      - name: Terraform apply
        run: |
          cd deployment/terraform
          terraform apply tfplan

      - name: Capture Terraform outputs
        run: |
          cd deployment/terraform
          echo "CF_DIST_ID=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_ENV"
          echo "S3_BUCKET=$(terraform output -raw s3_bucket_id)" >> "$GITHUB_ENV"
          echo "FRONTEND_URL=$(terraform output -raw frontend_url)" >> "$GITHUB_ENV"

      - name: Build frontend
        run: |
          npm ci
          npm run build:frontend

      - name: Upload frontend assets to S3
        run: |
          aws s3 sync frontend/dist "s3://${{ env.S3_BUCKET }}" --delete

      - name: Create CloudFront invalidation
        run: |
          DIST_ID="${{ env.CF_DIST_ID }}"
          BUCKET="${{ env.S3_BUCKET }}"

          # Build list of invalidation paths
          INVALIDATION_PATHS=("/index.html" "/manifest.json" "/favicon.ico" "/robots.txt")

          # Compare local dist/ with S3 to find changed hashed assets
          S3_ASSETS=$(aws s3 ls "s3://${BUCKET}/assets/" --recursive 2>/dev/null | awk '{print $4}' | sort)
          LOCAL_ASSETS=$(cd frontend/dist/assets 2>/dev/null && ls | sort || true)

          if [ -n "$S3_ASSETS" ] && [ -n "$LOCAL_ASSETS" ]; then
            CHANGED=$(diff <(echo "$S3_ASSETS") <(echo "$LOCAL_ASSETS") | grep '^>' | sed 's/^> //' || true)
            if [ -n "$CHANGED" ]; then
              while IFS= read -r file; do
                INVALIDATION_PATHS+=("/assets/${file}")
              done <<< "$CHANGED"
            fi
          elif [ -n "$LOCAL_ASSETS" ]; then
            # First deploy or all assets are new — invalidate all assets
            INVALIDATION_PATHS+=("/assets/*")
          fi

          # Build invalidation paths JSON
          PATHS_JSON=$(printf '%s\n' "${INVALIDATION_PATHS[@]}" | jq -R . | jq -s .)
          PATH_COUNT=${#INVALIDATION_PATHS[@]}
          CALLER_REF="deploy-$(date +%s)-$$"

          INVALIDATION_BATCH=$(jq -n \
            --argjson count "$PATH_COUNT" \
            --argjson paths "$PATHS_JSON" \
            --arg ref "$CALLER_REF" \
            '{Paths: {Quantity: $count, Items: $paths}, CallerReference: $ref}')

          echo "Invalidating $PATH_COUNT path(s): ${INVALIDATION_PATHS[*]}"
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --invalidation-batch "$INVALIDATION_BATCH" \
            --query 'Invalidation.Id' --output text)

          echo "Waiting for invalidation $INVALIDATION_ID to complete..."
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DIST_ID" \
            --id "$INVALIDATION_ID"
          echo "Invalidation $INVALIDATION_ID completed successfully"

      - name: Smoke check CDN
        run: |
          sleep 10
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ env.FRONTEND_URL }}")
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::CDN smoke check failed with HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "CDN smoke check passed (HTTP $HTTP_STATUS)"

  deploy-production:
    if: github.ref == 'refs/heads/main'
    needs: zap-security-gate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://stellar-portfolio.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js for deployment metadata checks
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve Sentry release metadata
        run: node scripts/sentry-metadata.mjs --deployment production >> "$GITHUB_ENV"

      - name: Validate Sentry release metadata
        run: node scripts/sentry-metadata.mjs --validate

      - name: Build Docker images
        run: docker compose -f deployment/docker-compose.yml build

      - name: Validate local observability bootstrap
        run: bash scripts/bootstrap-observability.sh

      - name: Tear down observability stack
        if: always()
        run: docker compose -f deployment/docker-compose.yml --profile monitoring down -v

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Terraform init
        run: |
          cd deployment/terraform
          terraform init
          terraform workspace select production || terraform workspace new production

      - name: Terraform plan
        run: |
          cd deployment/terraform
          terraform plan -var-file=production.tfvars -out=tfplan

      - name: Terraform apply
        run: |
          cd deployment/terraform
          terraform apply tfplan

      - name: Capture Terraform outputs
        run: |
          cd deployment/terraform
          echo "CF_DIST_ID=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_ENV"
          echo "S3_BUCKET=$(terraform output -raw s3_bucket_id)" >> "$GITHUB_ENV"
          echo "FRONTEND_URL=$(terraform output -raw frontend_url)" >> "$GITHUB_ENV"

      - name: Build frontend
        run: |
          npm ci
          npm run build:frontend

      - name: Upload frontend assets to S3
        run: |
          aws s3 sync frontend/dist "s3://${{ env.S3_BUCKET }}" --delete

      - name: Create CloudFront invalidation
        run: |
          DIST_ID="${{ env.CF_DIST_ID }}"
          BUCKET="${{ env.S3_BUCKET }}"

          INVALIDATION_PATHS=("/index.html" "/manifest.json" "/favicon.ico" "/robots.txt")

          S3_ASSETS=$(aws s3 ls "s3://${BUCKET}/assets/" --recursive 2>/dev/null | awk '{print $4}' | sort)
          LOCAL_ASSETS=$(cd frontend/dist/assets 2>/dev/null && ls | sort || true)

          if [ -n "$S3_ASSETS" ] && [ -n "$LOCAL_ASSETS" ]; then
            CHANGED=$(diff <(echo "$S3_ASSETS") <(echo "$LOCAL_ASSETS") | grep '^>' | sed 's/^> //' || true)
            if [ -n "$CHANGED" ]; then
              while IFS= read -r file; do
                INVALIDATION_PATHS+=("/assets/${file}")
              done <<< "$CHANGED"
            fi
          elif [ -n "$LOCAL_ASSETS" ]; then
            INVALIDATION_PATHS+=("/assets/*")
          fi

          PATHS_JSON=$(printf '%s\n' "${INVALIDATION_PATHS[@]}" | jq -R . | jq -s .)
          PATH_COUNT=${#INVALIDATION_PATHS[@]}
          CALLER_REF="deploy-$(date +%s)-$$"

          INVALIDATION_BATCH=$(jq -n \
            --argjson count "$PATH_COUNT" \
            --argjson paths "$PATHS_JSON" \
            --arg ref "$CALLER_REF" \
            '{Paths: {Quantity: $count, Items: $paths}, CallerReference: $ref}')

          echo "Invalidating $PATH_COUNT path(s): ${INVALIDATION_PATHS[*]}"
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --invalidation-batch "$INVALIDATION_BATCH" \
            --query 'Invalidation.Id' --output text)

          echo "Waiting for invalidation $INVALIDATION_ID to complete..."
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DIST_ID" \
            --id "$INVALIDATION_ID"
          echo "Invalidation $INVALIDATION_ID completed successfully"

      - name: Smoke check CDN
        run: |
          sleep 10
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ env.FRONTEND_URL }}")
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::CDN smoke check failed with HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "CDN smoke check passed (HTTP $HTTP_STATUS)"
