name: Secret Scan
on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@ with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }
