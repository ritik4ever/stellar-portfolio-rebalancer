name: Backend Performance Test

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/performance-test.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/performance-test.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  actions: write

jobs:
  performance-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install clinic.js globally
        run: npm install -g clinic

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      - name: Make load test script executable
        run: chmod +x ./backend/scripts/load-test.mjs

      - name: Start backend with clinic.js doctor
        working-directory: ./backend
        timeout-minutes: 8
        run: |
          # Set minimal environment for backend startup
          export NODE_ENV=test
          export DB_PATH="/tmp/perf-test.db"
          export DEMO_MODE="true"
          export ALLOW_DEMO_BALANCE_FALLBACK="true"
          export JWT_SECRET="test-secret-key-for-performance-testing-at-least-32-chars"
          export STELLAR_NETWORK="testnet"
          export STELLAR_HORIZON_URL="https://horizon-testnet.stellar.org"
          export STELLAR_CONTRACT_ADDRESS="CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
          export STELLAR_NETWORK_PASSPHRASE="Test SDF Network ; September 2015"
          export CORS_ORIGINS="http://localhost:3000,http://localhost:5173"
          export LOG_LEVEL="warn"
          export ENABLE_STARTUP_SELF_TEST="false"
          export PORT=3000

          # Start backend with clinic.js doctor
          timeout 180 clinic doctor --collect-only -- node dist/index.js &
          BACKEND_PID=$!

          # Wait for backend to become ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null || curl -sf http://localhost:3000/health > /dev/null; then
              break
            fi
            sleep 1
          done

          # Run load test for 60 seconds
          BACKEND_URL="http://localhost:3000" DURATION_MS=60000 timeout 90 node ./scripts/load-test.mjs
          LOAD_TEST_EXIT=$?

          # Send SIGINT to clinic so it flushes profiling data gracefully
          kill -INT $BACKEND_PID 2>/dev/null || true
          wait $BACKEND_PID || true

          exit $LOAD_TEST_EXIT
        env:
          NODE_OPTIONS: '--max-old-space-size=2048'

      - name: Analyze clinic report
        if: always()
        working-directory: ./backend
        run: node ./scripts/analyze-clinic-report.mjs

      - name: Upload clinic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clinic-report
          path: backend/.clinic/
          retention-days: 30

      - name: Generate summary
        if: always()
        run: |
          echo "## Performance Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test Configuration:**" >> $GITHUB_STEP_SUMMARY
          echo "- Duration: 5 minutes" >> $GITHUB_STEP_SUMMARY
          echo "- Concurrent Workers: 10" >> $GITHUB_STEP_SUMMARY
          echo "- Heap Growth Threshold: 50MB" >> $GITHUB_STEP_SUMMARY
          echo "- Profiler: clinic.js doctor" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifacts:** Check the 'clinic-report' artifact for detailed heap usage graphs and analysis." >> $GITHUB_STEP_SUMMARY
