name: Secrets Scan

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan every commit introduced by the
          # PR, not just the merge commit — bypassing the local pre-commit
          # hook (or skipping it with --no-verify) does not skip this check.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
