name: Env Example Validation

on:
  pull_request:
    paths:
      - 'backend/.env.example'
      - 'frontend/.env.example'
      - 'docs/ENVIRONMENT.md'
      - 'backend/src/**'
      - 'frontend/src/**'
      - 'backend/package.json'
      - 'scripts/validate-env-examples.mjs'
      - '.github/workflows/env-example-validation.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/.env.example'
      - 'frontend/.env.example'
      - 'docs/ENVIRONMENT.md'
      - 'backend/src/**'
      - 'frontend/src/**'
      - 'backend/package.json'
      - 'scripts/validate-env-examples.mjs'
      - '.github/workflows/env-example-validation.yml'

jobs:
  validate-env-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Validate env examples and environment docs
        run: npm run validate:env-examples

      - name: Fail if env examples drift from source
        run: |
          if ! git diff --quiet -- backend/.env.example frontend/.env.example docs/ENVIRONMENT.md; then
            echo "::error::.env.example files are out of sync. Run 'npm run validate:env-examples' locally and commit the result."
            git diff -- backend/.env.example frontend/.env.example docs/ENVIRONMENT.md
            exit 1
          fi
