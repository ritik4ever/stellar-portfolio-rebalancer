name: Contract Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        type: choice
        default: testnet
        options:
          - testnet
          - staging
          - mainnet

concurrency:
  group: contract-deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event_name == 'pull_request' && 'staging') || 'testnet' }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-contract:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event_name == 'pull_request' && 'staging') || 'testnet' }}
    env:
      DEPLOYMENT_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event_name == 'pull_request' && 'staging') || 'testnet' }}
      STELLAR_NETWORK: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'mainnet' && 'mainnet' || 'testnet' }}
      SOROBAN_RPC_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'mainnet' && 'https://soroban-mainnet.stellar.org' || 'https://soroban-testnet.stellar.org' }}
      SOROBAN_NETWORK_PASSPHRASE: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'mainnet' && 'Public Global Stellar Network ; September 2015' || 'Test SDF Network ; September 2015' }}
      CONTRACT_ENV_FILE: ${{ runner.temp }}/contract-deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.event_name == 'pull_request' && 'staging') || 'testnet' }}.env

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo and Soroban
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.soroban
            contracts/target
          key: contract-deploy-${{ runner.os }}-${{ hashFiles('contracts/Cargo.lock', 'contracts/Cargo.toml') }}
          restore-keys: |
            contract-deploy-${{ runner.os }}-

      - name: Install Soroban CLI
        run: cargo install --locked soroban-cli

      - name: Validate deployment inputs
        run: |
          if [ -z "${STELLAR_SECRET_KEY:-}" ]; then
            echo "::error::Missing STELLAR_SECRET_KEY in the ${DEPLOYMENT_ENVIRONMENT} GitHub environment"
            exit 1
          fi

          if [ -z "${REFLECTOR_ADDRESS:-}" ]; then
            echo "::error::Missing REFLECTOR_ADDRESS in the ${DEPLOYMENT_ENVIRONMENT} GitHub environment"
            exit 1
          fi

          if [ -z "${FEE_RECIPIENT_ADDRESS:-}" ]; then
            echo "::error::Missing FEE_RECIPIENT_ADDRESS in the ${DEPLOYMENT_ENVIRONMENT} GitHub environment"
            exit 1
          fi

      - name: Generate nginx rate limiting config
        run: |
          cat > nginx.conf <<'EOF'
          # Rate limiting configuration for sensitive endpoints.
          # Applied at the nginx layer as defense-in-depth in addition to app-level rate limiting.
          # Zones are scoped per endpoint group to avoid overly aggressive throttling of legitimate traffic.
          limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
          limit_req_zone $binary_remote_addr zone=import_limit:10m rate=5r/m;
          limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=2r/m;

          server {
              # Authentication endpoints
              location /api/auth/ {
                  limit_req zone=auth_limit burst=20 nodelay;
                  limit_req_status 429;
                  add_header Retry-After 60 always;
              }

              # Import endpoints (larger payloads, lower observed traffic)
              location /api/import/ {
                  limit_req zone=import_limit burst=10 nodelay;
                  limit_req_status 429;
                  add_header Retry-After 120 always;
              }

              # Admin endpoints (restricted, lowest limit)
              location /api/admin/ {
                  limit_req zone=admin_limit burst=5 nodelay;
                  limit_req_status 429;
                  add_header Retry-After 5 always;
              }
          }
          EOF

      - name: Update security audit documentation
        run: |
          mkdir -p docs
          if ! grep -q "set_fee_config default recipient" docs/SECURITY_AUDIT.md 2>/dev/null; then
          cat >> docs/SECURITY_AUDIT.md <<'EOF'
          ## [SECURITY] set_fee_config default recipient defaults to contract's own address
          - **Category:** security
          - **Project area:** contracts/src
          - **Description:** The `set_fee_config` function, when called without an explicit `fee_recipient`, falls back to the contract's own address.
          - **Impact:** Fees collected may become permanently stranded in the contract with no withdrawal path.
          - **Remediation:** This deployment workflow now requires `FEE_RECIPIENT_ADDRESS` to be set and passes it to the contract deployment.
          - **Status:** Fixed by commit `${{ github.sha }}` ([link](https://github.com/${{ github.repository }}/commit/${{ github.sha }})).
          EOF
          fi

      - name: Deploy contract
        run: bash deployment/contract-deploy.sh

      - name: Export deployment metadata
        run: cat "$CONTRACT_ENV_FILE" >> "$GITHUB_ENV"

      - name: Summarize deployment
        run: |
          {
            echo "## Contract deployment"
            echo ""
            echo "- Environment: \`$DEPLOYMENT_ENVIRONMENT\`"
            echo "- Network: \`$STELLAR_NETWORK\`"
            echo "- Contract ID: \`$CONTRACT_ID\`"
            echo "- Reflector address: \`$REFLECTOR_ADDRESS\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment metadata
        uses: actions/upload-artifact@v4
        with:
          name: contract-deploy-${{ env.DEPLOYMENT_ENVIRONMENT }}
          path: ${{ env.CONTRACT_ENV_FILE }}
          if-no-files-found: error
