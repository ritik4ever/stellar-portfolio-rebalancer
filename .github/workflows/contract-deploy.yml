name: Contract Deploy



concurrency:

  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  # Dependency scanning gate. To explicitly waive an advisory:
  # - Add the advisory ID (RUSTSEC-XXXX or GHSA-XXXX) to `.dependency-audit/cargo-allowlist.txt` or `.dependency-audit/npm-allowlist.txt`
  #   (one ID per line, blank lines and comments starting with # are ignored).
  # - Commit the allowlist file; this becomes part of the audit trail.
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        working-directory: contracts
        run: |
          args=()
          if [ -f .dependency-audit/cargo-allowlist.txt ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              args+=(--ignore "$line")
            done < .dependency-audit/cargo-allowlist.txt
          fi
          cargo audit "${args[@]}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run npm audit (backend & frontend)
        run: |
          set -euo pipefail
          for dir in backend frontend; do
            echo "Scanning $dir..."
            (cd "$dir" && node -e "
              const fs = require('fs');
              const path = '../.dependency-audit/npm-allowlist.txt';
              const allowlist = fs.existsSync(path) ? fs.readFileSync(path, 'utf8').split(/\r?\n/).filter(l => l && !l.startsWith('#')) : [];
              const { execSync } = require('child_process');
              let stdout;
              try {
                stdout = execSync('npm audit --json --audit-level=high', { encoding: 'utf8', stdio: ['pipe','pipe','ignore'] });
              } catch (e) {
                stdout = (e.stdout || '').toString();
              }
              const json = JSON.parse(stdout);
              const vulns = Object.values(json.vulnerabilities || {}).filter(v => (v.severity === 'high' || v.severity === 'critical') && !allowlist.includes(v.name));
              if (vulns.length > 0) {
                console.error('npm audit failed:', vulns.map(v => v.name + '@' + v.severity).join(', '));
                process.exit(1);
              }
              console.log('npm audit passed');
            ")
          done

  deploy-contract:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest


    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Cargo and Soroban
        uses: actions/cache@v4
        with:

      - name: Install Soroban CLI
        run: cargo install --locked soroban-cli
      - name: Validate deployment inputs
        run: |

            exit 1
          fi

      # AWS Budget Alerting
      # Ensure the monthly budget and notification thresholds are applied via Terraform.
      # See deployment/terraform for budget definitions and escalation contacts.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Apply AWS Budget
        working-directory: deployment/terraform
        run: terraform init -input=false && terraform apply -input=false -auto-approve -target=aws_budgets_budget.monthly

          if [ -z "${FEE_RECIPIENT_ADDRESS:-}" ]; then
            echo "::error::Missing FEE_RECIPIENT_ADDRESS in the ${DEPLOYMENT_ENVIRONMENT} GitHub environment"
            exit 1
          fi

      - name: Generate nginx rate limiting config
        run: |
          cat > nginx.conf <<'EOF'
          # Rate limiting configuration for sensitive endpoints.
          # Applied at the nginx layer as defense-in-depth in addition to app-level rate limiting.
          # Zones are scoped per endpoint group to avoid overly aggressive throttling of legitimate traffic.
          limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
          limit_req_zone $binary_remote_addr zone=import_limit:10m rate=5r/m;
          limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=2r/m;

          server {
              # Authentication endpoints
              location /api/auth/ {
                  limit_req zone=auth_limit burst=20 nodelay;
                  limit_req_status 429;
                  add_header Retry-After 60 always;
              }

              # Import endpoints (larger payloads, lower observed traffic)
              location /api/import/ {
                  limit_req zone=import_limit burst=10 nodelay;
                  limit_req_status 429;
                  add_header Retry-After 120 always;
              }

              # Admin endpoints (restricted, lowest limit)
              location /api/admin/ {
                  limit_req zone=admin_limit burst=5 nodelay;
                  limit_req_status 429;
                  add_header Retry-After 5 always;
              }
          }
          EOF

      - name: Update security audit documentation
        run: |
          mkdir -p docs
          if ! grep -q "set_fee_config default recipient" docs/SECURITY_AUDIT.md 2>/dev/null; then
          cat >> docs/SECURITY_AUDIT.md <<'EOF'
          ## [SECURITY] set_fee_config default recipient defaults to contract's own address
          - **Category:** security
          - **Project area:** contracts/src
          - **Description:** The `set_fee_config` function, when called without an explicit `fee_recipient`, falls back to the contract's own address.
          - **Impact:** Fees collected may become permanently stranded in the contract with no withdrawal path.
          - **Remediation:** This deployment workflow now requires `FEE_RECIPIENT_ADDRESS` to be set and passes it to the contract deployment.
          - **Status:** Fixed by commit `${{ github.sha }}` ([link](https://github.com/${{ github.repository }}/commit/${{ github.sha }})).
          EOF
          fi

      - name: Deploy contract
        run: bash deployment/contract-deploy.sh
      - name: Export deployment metadata

      - name: Summarize deployment
        run: |
          {
            echo "## Contract deployment"
            echo ""

