[graph]
targets = [
  "wasm32v1-none",
  "wasm32-unknown-unknown",
  "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
version = 2
vulnerability = "warn"
unmaintained = "warn"
yanked = "warn"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
unlicensed = "warn"
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
  "0BSD",
  "Unicode-DFS-2016",
  "OpenSSL",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
