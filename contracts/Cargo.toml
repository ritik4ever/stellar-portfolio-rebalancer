[package]
name = "portfolio-rebalancer"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
soroban-sdk = "21.0.0"
# Force ed25519-dalek 2.x — soroban-env-host 21.2.1 depends on
# ed25519-dalek >=2.0.0 (unbounded) which resolves to 3.0.0.
# 3.0.0 is incompatible with the testutils module.
ed25519-dalek = "=2.2.0"

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
proptest = "1.4.0"

[features]
default = []
# testutils enables soroban-sdk test utilities (needed for unit & integration tests).
# It is NOT enabled by default to avoid pulling in soroban-env-host testutils
# which has an ed25519-dalek 3.0.0 incompatibility on newer Rust versions.
# Use `cargo test --features testutils` for unit/integration tests.
testutils = ["soroban-sdk/testutils"]
integration = ["testutils"]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true