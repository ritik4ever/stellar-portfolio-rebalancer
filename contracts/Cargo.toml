[package]
name = "portfolio-rebalancer"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# Force ed25519-dalek 2.x to prevent 3.0.0 conflict with testutils
ed25519-dalek = "=2.2.0"
soroban-sdk = "27.0.2"

[dev-dependencies]
soroban-sdk = { version = "27.0.2", features = ["testutils"] }
proptest = "1.4.0"
ed25519-dalek = "2.2.0"

[features]
default = []
testutils = ["soroban-sdk/testutils"]
integration = []

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true